<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Chat</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin: 0 0 20px 0;
      color: #333;
    }
    #status {
      padding: 12px;
      border-radius: 6px;
      margin: 15px 0;
      font-weight: 500;
      text-align: center;
    }
    .disconnected { background: #fee; color: #c33; }
    .connected { background: #efe; color: #363; }
    .connecting { background: #ffa; color: #883; }
    button {
      padding: 12px 24px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #startBtn {
      background: #4CAF50;
      color: white;
    }
    #startBtn:hover:not(:disabled) {
      background: #45a049;
    }
    #stopBtn {
      background: #f44336;
      color: white;
    }
    #stopBtn:hover:not(:disabled) {
      background: #da190b;
    }
    #stats {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 6px;
      font-size: 14px;
      color: #666;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Voice Chat</h1>
    <div id="status" class="disconnected">🟥 Disconnected</div>
    
    <div>
      <button type="button" id="startBtn">🎤 Start Chat</button>
      <button type="button" id="stopBtn" disabled>🛑 Stop Chat</button>
    </div>

    <div id="stats">
      <div class="stat-row">
        <span>Sent:</span>
        <span id="sentBytes">0 KB</span>
      </div>
      <div class="stat-row">
        <span>Received:</span>
        <span id="receivedBytes">0 KB</span>
      </div>
      <div class="stat-row">
        <span>Audio Queue:</span>
        <span id="queueTime">0.0s</span>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const sentBytesEl = document.getElementById("sentBytes");
    const receivedBytesEl = document.getElementById("receivedBytes");
    const queueTimeEl = document.getElementById("queueTime");

    let ws = null;
    let audioCtx = null;
    let nextStartTime = 0;
    let mediaStream = null;
    let audioProcessor = null;
    let sentBytes = 0;
    let receivedBytes = 0;

    function updateStatus(text, className) {
      statusEl.innerText = text;
      statusEl.className = className;
    }

    function updateStats() {
      sentBytesEl.innerText = `${(sentBytes / 1024).toFixed(1)} KB`;
      receivedBytesEl.innerText = `${(receivedBytes / 1024).toFixed(1)} KB`;
      if (audioCtx) {
        const queuedTime = Math.max(0, nextStartTime - audioCtx.currentTime);
        queueTimeEl.innerText = `${queuedTime.toFixed(2)}s`;
      }
    }

    async function startMicrophone(ws) {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: 24000,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });

        const context = new AudioContext({ sampleRate: 24000 });
        const source = context.createMediaStreamSource(mediaStream);
        audioProcessor = context.createScriptProcessor(4096, 1, 1);

        audioProcessor.onaudioprocess = (e) => {
          if (ws.readyState !== WebSocket.OPEN) return;

          const inputData = e.inputBuffer.getChannelData(0);
          const pcmData = new Int16Array(inputData.length);
          
          for (let i = 0; i < inputData.length; i++) {
            const s = Math.max(-1, Math.min(1, inputData[i]));
            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
          }

          ws.send(pcmData.buffer);
          sentBytes += pcmData.byteLength;
        };

        source.connect(audioProcessor);
        audioProcessor.connect(context.destination);

        console.log("🎤 Microphone started");
      } catch (err) {
        console.error("Microphone error:", err);
        updateStatus("❌ Microphone access denied", "disconnected");
        if (ws) ws.close();
      }
    }

    function stopMicrophone() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (audioProcessor) {
        audioProcessor.disconnect();
        audioProcessor = null;
      }
      console.log("🎤 Microphone stopped");
    }

    function playAudio(binaryData) {
      if (!audioCtx) {
        // Use the browser's native sample rate (usually 48000 Hz)
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const int16Data = new Int16Array(binaryData);
      // Create buffer at the actual sample rate the data was recorded at
      const actualSampleRate = 24000; // Incoming audio is 24kHz
      const buffer = audioCtx.createBuffer(1, int16Data.length, actualSampleRate);
      const channelData = buffer.getChannelData(0);

      for (let i = 0; i < int16Data.length; i++) {
        channelData[i] = int16Data[i] / 32768.0;
      }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);

      if (nextStartTime < audioCtx.currentTime) {
        nextStartTime = audioCtx.currentTime;
      }

      source.start(nextStartTime);
      nextStartTime += buffer.duration;

      receivedBytes += binaryData.byteLength;
    }

    function connect() {
      updateStatus("🟡 Connecting...", "connecting");
      
      // Use secure WebSocket if page is HTTPS
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//localhost:8080`;
      
      ws = new WebSocket(wsUrl);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        updateStatus("🟢 Connected! Speak now...", "connected");
        startBtn.disabled = true;
        stopBtn.disabled = false;
        startMicrophone(ws);
        
        // Update stats every 100ms
        statsInterval = setInterval(updateStats, 100);
      };

      ws.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
          playAudio(event.data);
        }
      };

      ws.onerror = (error) => {
        console.error("WebSocket error:", error);
        updateStatus("❌ Connection error", "disconnected");
      };

      ws.onclose = () => {
        updateStatus("🟥 Disconnected", "disconnected");
        startBtn.disabled = false;
        stopBtn.disabled = true;
        stopMicrophone();
        if (statsInterval) {
          clearInterval(statsInterval);
          statsInterval = null;
        }
      };
    }

    let statsInterval = null;

    startBtn.onclick = () => {
      // Don't pre-create audioCtx - let playAudio create it with correct settings
      
      // Reset stats
      sentBytes = 0;
      receivedBytes = 0;
      nextStartTime = 0;
      
      connect();
    };

    stopBtn.onclick = () => {
      if (ws) ws.close();
    };

    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
      stopMicrophone();
      if (ws) ws.close();
    });
  </script>
</body>
</html>
